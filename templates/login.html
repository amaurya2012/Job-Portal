<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

/* WRAPPER */
.wrapper {
    width: 900px;
    display: flex;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

/* LEFT */
.left {
    flex:1;
    background: linear-gradient(135deg,#1d2671,#c33764);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
}

.left h2 {
    font-weight:bold;
}

/* RIGHT */
.right {
    flex:1;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    padding:40px;
}

/* INPUT */
.form-control {
    background: rgba(255,255,255,0.1);
    border:none;
    color:white;
    border-radius:10px;
}

.form-control::placeholder {
    color:#ccc;
}

.form-control:focus {
    background: rgba(255,255,255,0.2);
    box-shadow:none;
    color:white;
}

/* BUTTON */
.btn-custom {
    background:white;
    color:#333;
    font-weight:bold;
    border-radius:10px;
    transition:0.3s;
}

.btn-custom:hover {
    transform:scale(1.03);
}

/* PASSWORD ICON */
.password-wrapper {
    position: relative;
}

.show-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
}

/* NAV */
.top-nav {
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
}

.nav-btn {
    padding:6px 12px;
    border-radius:20px;
    background: rgba(255,255,255,0.1);
    color:white;
    text-decoration:none;
}

/* LINK */
.link-text {
    margin-top:15px;
    display:block;
    text-decoration:none;
    color:#ddd;
}

.link-text:hover {
    color:white;
}

/* ANIMATION */
.fade {
    animation: fadeUp 0.7s ease forwards;
}

@keyframes fadeUp {
    from {
        opacity:0;
        transform:translateY(20px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>

<body>

<!-- NAV -->
<div class="top-nav">
    <a href="javascript:history.back()" class="nav-btn">← Back</a>
    <a href="/" class="nav-btn">Home</a>
</div>

<div class="wrapper fade">

<!-- LEFT -->
<div class="left">
    <div>
        <h2>Welcome Back 👋</h2>
        <p>Login to continue your journey and explore opportunities</p>
    </div>
</div>

<!-- RIGHT -->
<div class="right">

<h4 class="mb-3">Login to Your Account</h4>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST">

<input type="email" name="email" placeholder="Email Address"
       class="form-control my-2" required>

<div class="password-wrapper">
    <input type="password" id="password" name="password"
           placeholder="Password"
           class="form-control my-2" required>

    <span class="show-btn" onclick="togglePassword()">👁️</span>
</div>

<button class="btn btn-custom w-100 mt-3">Login</button>

</form>

<a href="/register" class="link-text">
Don't have an account? Register →
</a>

</div>

</div>

<script>
function togglePassword() {
    let input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
