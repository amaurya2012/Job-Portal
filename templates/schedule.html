<!DOCTYPE html>
<html>
<head>
<title>Schedule Interview</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg,#1d2671,#c33764);
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* Top Nav */
.top-nav {
    position: fixed;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    z-index: 1050;
}

.nav-btn {
    padding:8px 14px;
    border-radius:999px;
    background: rgba(255,255,255,0.1);
    color:white;
    text-decoration:none;
}

.nav-btn:hover {
    background: rgba(255,255,255,0.3);
}

/* Card */
.card-box {
    max-width: 550px;
    margin: 100px auto;
    padding: 30px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* Inputs */
.form-control {
    border-radius: 10px;
    border: none;
}

/* Button */
.btn-custom {
    background: #00c6ff;
    border: none;
    border-radius: 10px;
    font-weight: bold;
}

.btn-custom:hover {
    background: #0072ff;
}

.section-title {
    border-bottom: 1px solid rgba(255,255,255,0.2);
    margin-bottom: 10px;
    padding-bottom: 5px;
}
</style>
</head>

<body>

<div class="top-nav">
    <a href="javascript:history.back()" class="nav-btn">← Back</a>
    <a href="/all-applications" class="nav-btn">Applications</a>
</div>

<div class="card-box">

<h2 class="text-center mb-4">📅 Schedule Interview</h2>

<!-- 🔥 CANDIDATE INFO (PASS FROM BACKEND IF POSSIBLE) -->
{% if candidate %}
<div class="mb-3">
    <strong>Candidate:</strong> {{ candidate[0] }} <br>
    <strong>Job:</strong> {{ candidate[1] }}
</div>
{% endif %}

<form method="POST">

<!-- INTERVIEW TIME -->
<div class="mb-3">
    <div class="section-title">Interview Timing</div>

    <label>Date</label>
    <input type="date" name="date" class="form-control mb-2" required>

    <label>Time</label>
    <input type="time" name="time" class="form-control mb-2" required>
</div>

<!-- INTERVIEW DETAILS -->
<div class="mb-3">
    <div class="section-title">Interview Details</div>

    <input type="text" name="link"
           placeholder="Meeting Link (Zoom / Google Meet)"
           class="form-control mb-2">

    <input type="text" name="interviewer"
           placeholder="Interviewer Name"
           class="form-control mb-2">

    <textarea name="notes"
              placeholder="Instructions for candidate"
              class="form-control mb-2"
              style="height:100px;"></textarea>
</div>

<!-- SUBMIT -->
<button class="btn btn-custom w-100">
    🚀 Schedule Interview
</button>

</form>

</div>

</body>
</html>
