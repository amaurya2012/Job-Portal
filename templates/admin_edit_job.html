<!DOCTYPE html>
<html>
<head>
<title>Edit Job</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg,#1d2671,#c33764);
    color: white;
}

.card {
    max-width: 600px;
    margin: 50px auto;
    padding: 30px;
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div class="card">

<h3>Edit Job</h3>

<form method="POST">

<input name="title" value="{{ job.title }}" class="form-control my-2">
<input name="company" value="{{ job.company }}" class="form-control my-2">
<input name="location" value="{{ job.location }}" class="form-control my-2">
<input name="salary" value="{{ job.salary }}" class="form-control my-2">

<textarea name="description" class="form-control my-2">{{ job.description }}</textarea>

<input name="skills" value="{{ job.skills }}" class="form-control my-2">
<input name="experience" value="{{ job.experience }}" class="form-control my-2">

<input name="job_type" value="{{ job.job_type }}" class="form-control my-2">

<input type="date" name="deadline" value="{{ job.deadline }}" class="form-control my-2">
<input name="openings" value="{{ job.openings }}" class="form-control my-2">

<button class="btn btn-light w-100 mt-3">Update Job</button>

</form>

</div>

</body>
</html>
