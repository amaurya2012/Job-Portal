<!DOCTYPE html>
<html>
<head>
<title>Edit Job</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f4f6f9;
    font-family: 'Segoe UI', sans-serif;
}

/* CONTAINER */
.form-box {
    max-width: 750px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

/* TITLE */
.title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 20px;
}

/* LABEL */
label {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 4px;
}

/* INPUT */
.form-control {
    border-radius: 8px;
    font-size: 14px;
}

/* BUTTON */
.btn-update {
    border-radius: 8px;
    padding: 10px;
    font-weight: 500;
}
</style>

</head>

<body>

<div class="form-box">

<div class="d-flex justify-content-between align-items-center mb-3">
    <div class="title">✏️ Edit Job</div>
    <a href="/employer/jobs" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<form method="POST">

<!-- TITLE -->
<label>Job Title</label>
<input name="title" value="{{ job.title }}" class="form-control mb-3" required>

<!-- COMPANY -->
<label>Company Name</label>
<input name="company" value="{{ job.company }}" class="form-control mb-3" required>

<!-- LOCATION + SALARY -->
<div class="row">
    <div class="col-md-6">
        <label>Location</label>
        <input name="location" value="{{ job.location }}" class="form-control mb-3">
    </div>

    <div class="col-md-6">
        <label>Salary (₹)</label>
        <input name="salary" value="{{ job.salary }}" class="form-control mb-3">
    </div>
</div>

<!-- DESCRIPTION -->
<label>Job Description</label>
<textarea name="description" class="form-control mb-3" rows="4">{{ job.description }}</textarea>

<!-- SKILLS -->
<label>Required Skills</label>
<input name="skills" value="{{ job.skills }}" class="form-control mb-3">

<!-- EXPERIENCE -->
<label>Experience</label>
<input name="experience" value="{{ job.experience }}" class="form-control mb-3">

<!-- JOB TYPE -->
<label>Job Type</label>
<select name="job_type" class="form-control mb-3">
    <option {% if job.job_type == 'Full-Time' %}selected{% endif %}>Full-Time</option>
    <option {% if job.job_type == 'Part-Time' %}selected{% endif %}>Part-Time</option>
    <option {% if job.job_type == 'Internship' %}selected{% endif %}>Internship</option>
</select>

<!-- DEADLINE + OPENINGS -->
<div class="row">
    <div class="col-md-6">
        <label>Application Deadline</label>
        <input type="date" name="deadline" value="{{ job.deadline }}" class="form-control mb-3">
    </div>

    <div class="col-md-6">
        <label>Openings</label>
        <input name="openings" value="{{ job.openings }}" class="form-control mb-3">
    </div>
</div>

<!-- BUTTON -->
<button class="btn btn-primary w-100 btn-update">
Update Job
</button>

</form>

</div>

</body>
</html>
