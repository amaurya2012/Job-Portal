<!DOCTYPE html>
<html>
<head>
<title>Notifications</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg,#1d2671,#c33764);
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* Container */
.panel {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    padding: 25px;
    border-radius: 15px;
}

/* Notification Card */
.notification-card {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s;
}

/* Hover effect */
.notification-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

/* Unread highlight */
.unread {
    border-left: 5px solid #ffc107;
}

/* Content */
.notif-title {
    font-weight: bold;
    font-size: 15px;
}

.notif-msg {
    font-size: 14px;
    color: #ddd;
}

.notif-time {
    font-size: 12px;
    color: #bbb;
}

/* Button */
.btn-mark {
    border-radius: 10px;
    font-size: 12px;
}

.top-bar {
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.nav-btn {
    padding:6px 12px;
    border-radius:20px;
    background: rgba(255,255,255,0.1);
    color:white;
    text-decoration:none;
}
.nav-btn:hover {
    background: rgba(255,255,255,0.3);
}
</style>
</head>

<body>

<div class="container py-4">

<div class="panel">

<!-- TOP -->
<div class="top-bar">
    <h4>🔔 Notifications</h4>
    <a href="/dashboard" class="nav-btn">← Dashboard</a>
</div>

{% if rows %}

    {% for r in rows %}
    <div class="notification-card {% if r[5]==0 %}unread{% endif %}">

        <div>
            <div class="notif-title">📢 {{ r[1] }}</div>
            <div class="notif-msg">{{ r[2] }}</div>
            <div class="notif-time">🕒 {{ r[3] }}</div>
        </div>

        <div>
            {% if r[5]==0 %}
                <a href="/notifications/mark/{{ r[0] }}" 
                   class="btn btn-warning btn-sm btn-mark">
                   Mark Read
                </a>
            {% else %}
                <span class="badge bg-success">✔ Read</span>
            {% endif %}
        </div>

    </div>
    {% endfor %}

{% else %}

    <div class="alert alert-light text-dark text-center">
        🚫 No Notifications Yet
    </div>

{% endif %}

</div>

</div>

</body>
</html>
