<!DOCTYPE html>
<html>
<head>
<title>Admin - Jobs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    font-family: 'Segoe UI', sans-serif;
    color: white;
}

/* HEADER */
.header {
    padding: 20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* CONTAINER */
.container-box {
    max-width: 1100px;
    margin: auto;
}

/* JOB CARD (GLASS EFFECT) */
.job-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    transition: 0.3s;
}

.job-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* TITLE */
.title {
    font-size: 18px;
    font-weight: 600;
}

/* META */
.meta {
    font-size: 13px;
    color: #d1d5db;
}

/* BADGE */
.badge-box {
    background: rgba(255,255,255,0.2);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
}

/* TAG */
.tag {
    background: rgba(255,255,255,0.15);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    margin-right: 6px;
}

/* EMPTY */
.empty {
    text-align:center;
    margin-top:50px;
    opacity:0.7;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <h4>💼 Job Listings</h4>
    <a href="/admin-dashboard" class="btn btn-light btn-sm">Dashboard</a>
</div>

<div class="container-box">

{% if jobs %}
{% for job in jobs %}

<div class="job-card">

<!-- TOP -->
<div class="d-flex justify-content-between">

<div>
    <div class="title">{{ job.title }}</div>
    <div class="meta">
        {{ job.company }} • {{ job.location }}
    </div>
</div>

<div class="badge-box">
    👥 {{ job.total_applicants }} Applicants
</div>

</div>

<!-- DESCRIPTION -->
<p class="mt-2 mb-2" style="font-size:14px;">
{{ job.description[:140] }}...
</p>

<!-- TAGS -->
<div>
    <span class="tag">🧠 {{ job.skills }}</span>
    <span class="tag">🎯 {{ job.experience }}</span>
</div>

</div>

{% endfor %}
{% else %}

<div class="empty">
    <h5>No jobs available</h5>
</div>

{% endif %}

</div>

</body>
</html>
