<!DOCTYPE html>
<html>
<head>
    <title>Post Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        /* Top Nav */
        .top-nav {
            display:flex;
            justify-content:space-between;
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .nav-btn {
            padding:8px 14px;
            border-radius:999px;
            background: rgba(255,255,255,0.1);
            color:white;
            text-decoration:none;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Container */
        .form-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 30px;
            margin-top: 90px;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: none;
        }

        .btn-post {
            background: #00c6ff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-post:hover {
            background: #0072ff;
        }

        h4 {
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

    </style>
</head>

<body>

<div class="top-nav">
    <a href="javascript:history.back()" class="nav-btn">← Back</a>
    <a href="/dashboard" class="nav-btn">Home</a>
</div>

<div class="container">

    <div class="form-box">

        <h2 class="text-center mb-4">💼 Post a New Job</h2>

        <form method="POST">

            <!-- BASIC DETAILS -->
            <h4>Basic Details</h4>

            <div class="row">
                <div class="col-md-6">
                    <input type="text" name="title" placeholder="Job Title"
                           class="form-control mb-3" required>
                </div>

                <div class="col-md-6">
                    <input type="text" name="company" placeholder="Company Name"
                           class="form-control mb-3" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <input type="text" name="location" placeholder="Location"
                           class="form-control mb-3" required>
                </div>

                <div class="col-md-6">
                    <input type="text" name="salary" placeholder="Salary (₹)"
                           class="form-control mb-3" required>
                </div>
            </div>

            <!-- JOB DETAILS -->
            <h4>Job Details</h4>

            <textarea name="description" placeholder="Job Description"
                      class="form-control mb-3" style="height:120px;"></textarea>

            <input type="text" name="skills"
                   placeholder="Required Skills (Python, SQL, etc)"
                   class="form-control mb-3">

            <input type="text" name="experience"
                   placeholder="Experience (e.g., 2+ years)"
                   class="form-control mb-3">

            <!-- JOB TYPE -->
            <select name="job_type" class="form-select mb-3">
                <option value="">Select Job Type</option>
                <option>Full-time</option>
                <option>Internship</option>
                <option>Part-time</option>
                <option>Remote</option>
            </select>

            <!-- EXTRA DETAILS -->
            <h4>Additional Info</h4>

            <div class="row">
                <div class="col-md-6">
                    <label>Application Deadline</label>
                    <input type="date" name="deadline"
                           class="form-control mb-3">
                </div>

                <div class="col-md-6">
                    <label>No. of Openings</label>
                    <input type="number" name="openings"
                           class="form-control mb-3">
                </div>
            </div>

            <!-- SUBMIT -->
            <button class="btn btn-post w-100 mt-3">
                🚀 Post Job
            </button>

        </form>

    </div>

</div>

</body>
</html>
