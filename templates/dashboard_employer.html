<!DOCTYPE html>
<html>
<head>
<title>Employer Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1d2671,#c33764);
    color:white;
}

/* SIDEBAR */
.sidebar {
    width:240px;
    height:100vh;
    position:fixed;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    padding:20px;
}

.sidebar h4 {
    margin-bottom:25px;
}

.sidebar a {
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-radius:10px;
    text-decoration:none;
    color:#ddd;
    transition:0.3s;
}

.sidebar a:hover {
    background: rgba(255,255,255,0.2);
    transform: translateX(5px);
}

.sidebar .active {
    background: rgba(255,255,255,0.3);
    color:white;
}

/* MAIN */
.main {
    margin-left:260px;
    padding:30px;
}

/* TOPBAR */
.topbar {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding:15px 20px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    margin-bottom:30px;
}

/* CARD */
.card-box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding:25px;
    border-radius:15px;
    text-align:center;
    transition:0.3s;
    animation: fadeUp 0.6s ease;
}

.card-box:hover {
    transform: translateY(-8px) scale(1.03);
}

/* ICON */
.icon {
    font-size:30px;
    margin-bottom:10px;
}

/* NUMBER */
.number {
    font-size:28px;
    font-weight:bold;
}

/* CHART */
.chart-box {
    background: rgba(255,255,255,0.15);
    padding:20px;
    border-radius:15px;
    margin-top:40px;
}

/* BUTTON */
.btn-custom {
    border-radius:10px;
}

/* ANIMATION */
@keyframes fadeUp {
    from {
        opacity:0;
        transform:translateY(20px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

<h4>🏢 Employer</h4>

<a href="/dashboard" class="active">
<i class="bi bi-speedometer2"></i> Dashboard
</a>

<a href="/post-job">
<i class="bi bi-plus-circle"></i> Post Job
</a>

<a href="/employer/jobs">
<i class="bi bi-briefcase"></i> My Jobs
</a>

<a href="/all-applications">
<i class="bi bi-people"></i> Applications
</a>

<a href="/logout" style="margin-top:20px;">
<i class="bi bi-box-arrow-right"></i> Logout
</a>

</div>

<!-- MAIN -->
<div class="main">

<!-- TOPBAR -->
<div class="topbar">
<h5>📊 Dashboard Overview</h5>
<span>Welcome Back 👋</span>
</div>

<!-- CARDS -->
<div class="row g-4">

<div class="col-md-4">
<div class="card-box">
<div class="icon">📄</div>
<div class="number">{{ total_jobs }}</div>
<p>Jobs Posted</p>
</div>
</div>

<div class="col-md-4">
<div class="card-box">
<div class="icon">👥</div>
<div class="number">{{ total_applications }}</div>
<p>Applications</p>
</div>
</div>

<div class="col-md-4">
<div class="card-box">
<div class="icon">⭐</div>
<div class="number">{{ shortlisted }}</div>
<p>Shortlisted</p>
</div>
</div>

</div>

<!-- CHART -->
<div class="chart-box">
<h5 class="mb-3">📊 Hiring Analytics</h5>
<canvas id="chart"></canvas>
</div>

<!-- ACTIONS -->
<div class="mt-4">
<h5>Quick Actions</h5>

<a href="/post-job" class="btn btn-light btn-custom mt-2 me-2">
➕ Post Job
</a>

<a href="/employer/jobs" class="btn btn-outline-light btn-custom mt-2">
💼 Manage Jobs
</a>
</div>

</div>

<script>
new Chart(document.getElementById("chart"), {
type: 'bar',
data: {
labels: ['Jobs', 'Applications', 'Shortlisted'],
datasets: [{
data: [
{{ total_jobs }},
{{ total_applications }},
{{ shortlisted }}
],
backgroundColor: ['#00c6ff','#0072ff','#ff758c']
}]
},
options:{
plugins:{legend:{display:false}}
}
});
</script>

</body>
</html>
