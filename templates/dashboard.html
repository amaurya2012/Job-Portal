<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: white;
            font-family: 'Poppins', sans-serif;
            padding-top: 72px;
        }

        .sidebar {
            height: 100vh;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            text-decoration: none;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
        }

        .topbar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 10px;
            margin: 15px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        .stat {
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="top-nav">
    <a href="javascript:history.back()" class="nav-btn">← Back</a>
    <a href="/dashboard" class="nav-btn">Home</a>
</div>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar col-2">
        <h4>JobPortal</h4>
        <hr>

        <a href="/dashboard">Dashboard</a>
        <a href="/post-job">Post Job</a>
        <a href="/view-jobs">View Jobs</a>
        <a href="/my-applications">My Applications</a>
        <a href="/logout">Logout</a>
    </div>

    <!-- Main -->
    <div class="col-10">

        <!-- Topbar -->
        <div class="topbar d-flex justify-content-between">
            <h5>Dashboard</h5>
            <span>Welcome 👋</span>
        </div>

        <!-- Content -->
        <div class="container mt-4">

            <div class="row g-4">

                <!-- Total Jobs -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="stat">{{ total_jobs }}</div>
                        <p>Jobs Available</p>
                    </div>
                </div>

                <!-- Total Applications -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="stat">{{ total_applications }}</div>
                        <p>Total Applications</p>
                    </div>
                </div>

                <!-- My Applications -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="stat">{{ my_applications }}</div>
                        <p>My Applications</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
